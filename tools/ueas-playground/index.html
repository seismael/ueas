<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UEAS v2.1 Studio Playground</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>UEAS v2.1 Studio</h1>
    <div class="controls">
      <select id="example-select" aria-label="Examples"></select>
      <button id="btn-run" type="button">Run @Test</button>
      <button id="btn-verify" type="button">Verify (L3)</button>
      <button id="btn-fmt" type="button">Format</button>
      <select id="target-select" aria-label="Codegen Target">
        <option value="rust">Rust</option>
        <option value="python">Python</option>
        <option value="typescript">TypeScript</option>
        <option value="wasm">WASM Binary</option>
        <option value="wit">WIT Interface</option>
        <option value="smt2">SMT-LIB2</option>
        <option value="dafny">Dafny 4</option>
        <option value="lean4">Lean 4</option>
        <option value="verus">Verus</option>
        <option value="latex">LaTeX</option>
        <option value="typst">Typst</option>
      </select>
      <button id="btn-transpile" type="button">Transpile</button>
      <button id="btn-share" type="button">Share URL</button>
      <button id="btn-cert" type="button">Download Cert</button>
    </div>
  </header>
  <main class="workspace">
    <section class="pane">
      <h2>UEAS v2.1 Source</h2>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>
    <section class="pane">
      <h2>Telemetry, Verification &amp; Output</h2>
      <div id="chart-panel" class="chart-panel"></div>
      <pre id="output"></pre>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
