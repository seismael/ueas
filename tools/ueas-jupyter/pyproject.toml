[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ueas-jupyter"
version = "2.0.0"
description = "UEAS v2.0 Jupyter Kernel backed by the ueas CLI"
requires-python = ">=3.10"
dependencies = ["ipykernel>=6.29"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
