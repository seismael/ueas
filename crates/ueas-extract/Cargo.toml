[package]
name = "ueas-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UEAS Tree-sitter multi-language algorithm extractors (Python, TypeScript, Rust) & Axiom 1 auditor"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"

[dev-dependencies]
ueas-syntax = { path = "../ueas-syntax" }
