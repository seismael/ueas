[package]
name = "ueas-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UEAS WASM bindings for Browser Web Worker and Edge MCP"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ueas-syntax = { path = "../ueas-syntax" }
ueas-hir = { path = "../ueas-hir" }
ueas-vm = { path = "../ueas-vm" }
ueas-verify = { path = "../ueas-verify" }
ueas-codegen = { path = "../ueas-codegen" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
