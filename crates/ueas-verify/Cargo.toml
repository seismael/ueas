[package]
name = "ueas-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UEAS 5-level progressive verification, property fuzzer, adversarial Big-O fitter & certificates"

[lints]
workspace = true

[dependencies]
ueas-syntax = { path = "../ueas-syntax" }
ueas-hir = { path = "../ueas-hir" }
ueas-vm = { path = "../ueas-vm" }
sha2 = "0.10"
hex = "0.4"
indexmap = "2"
num-bigint = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
