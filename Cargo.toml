[workspace]
resolver = "2"
members = [
    "crates/ueas-syntax",
    "crates/ueas-hir",
    "crates/ueas-vm",
    "crates/ueas-verify",
    "crates/ueas-codegen",
    "crates/ueas-extract",
    "crates/ueas-wasm",
    "tools/ueas-cli",
    "tools/ueas-lsp",
    "tools/ueas-dap",
    "tools/ueas-cloud-verify",
    "tests/ucts",
    "tests/differential",
    "xtask",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
