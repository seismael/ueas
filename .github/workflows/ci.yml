name: UEAS v2.0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p ueas-wasm --target wasm32-unknown-unknown
      - run: cargo xtask verify-clean

  typescript-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd tools/ueas-mcp-edge && npm ci && npm run typecheck
      - run: cd tools/ueas-playground && npm ci && npm run typecheck
      - run: cd tools/ueas-vscode && npm ci && npm run typecheck

  python-jupyter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy ipykernel
      - run: ruff check tools/ueas-jupyter
      - run: ruff format --check tools/ueas-jupyter
      - run: mypy --strict tools/ueas-jupyter/ueas_jupyter
